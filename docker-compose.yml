services:
  samd-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: samd-classifier:latest
    container_name: samd-classifier
    restart: unless-stopped
    ports:
      # Map host port (default 8001 to avoid clashing with port 8000) to container port 8000
      - "${SAMD_PORT:-8001}:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
